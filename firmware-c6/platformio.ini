[platformio]
default_envs = waveshare_c6

[env:waveshare_c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.33/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 4194304
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts =
  pre:../tools/embed_setup.py
  pre:../tools/opus_decoder_link.py
  post:../tools/flash_layout.py
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1
  zinggjm/GxEPD2@1.6.4

[env:waveshare_s3g]
extends = env:waveshare_c6
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions-s3g.csv
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
  ${env:waveshare_c6.build_flags}
  -DVOXI_BOARD_S3G=1
  -DBOARD_HAS_PSRAM

[env:waveshare_amoled18_v2]
extends = env:waveshare_s3g
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
  ${env:waveshare_c6.build_flags}
  -DVOXI_BOARD_AMOLED=1
  -DBOARD_HAS_PSRAM
lib_deps =
  ${env:waveshare_c6.lib_deps}
  moononournation/GFX Library for Arduino@1.6.4
  lewisxhe/XPowersLib@0.2.6

[env:zhengchen_minicam_20]
extends = env:waveshare_amoled18_v2
build_flags =
  ${env:waveshare_c6.build_flags}
  -DVOXI_BOARD_MINICAM=1
  -DBOARD_HAS_PSRAM
lib_deps =
  ${env:waveshare_c6.lib_deps}
  moononournation/GFX Library for Arduino@1.6.4

; Only for a board whose main switch is electrically isolated from power control.
[env:zhengchen_minicam_20_gpio11_ptt]
extends = env:zhengchen_minicam_20
build_flags =
  ${env:zhengchen_minicam_20.build_flags}
  -DVOXI_MINICAM_GPIO11_PTT=1

; One-time USB migration required. Existing factory builds remain unchanged.
[env:waveshare_s3g_ota]
extends = env:waveshare_s3g
board_build.partitions = partitions-ota-8m.csv
board_upload.maximum_size = 3145728
build_flags =
  ${env:waveshare_s3g.build_flags}
  -DVOXI_OTA=1
  -DVOXI_OTA_TARGET=\"waveshare_s3g_ota\"

[env:waveshare_amoled18_v2_ota]
extends = env:waveshare_amoled18_v2
board_build.partitions = partitions-ota-16m.csv
build_flags =
  ${env:waveshare_amoled18_v2.build_flags}
  -DVOXI_OTA=1
  -DVOXI_OTA_TARGET=\"waveshare_amoled18_v2_ota\"

[env:zhengchen_minicam_20_ota]
extends = env:zhengchen_minicam_20
board_build.partitions = partitions-ota-16m.csv
build_flags =
  ${env:zhengchen_minicam_20.build_flags}
  -DVOXI_OTA=1
  -DVOXI_OTA_TARGET=\"zhengchen_minicam_20_ota\"

[env:zhengchen_minicam_20_gpio11_ptt_ota]
extends = env:zhengchen_minicam_20_gpio11_ptt
board_build.partitions = partitions-ota-16m.csv
build_flags =
  ${env:zhengchen_minicam_20_gpio11_ptt.build_flags}
  -DVOXI_OTA=1
  -DVOXI_OTA_TARGET=\"zhengchen_minicam_20_gpio11_ptt_ota\"
