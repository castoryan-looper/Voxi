<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxi · 设备管理</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#20332f;background:#f1f5f2}*{box-sizing:border-box}body{max-width:1080px;margin:0 auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}h2{font-size:18px;margin:0 0 12px}.tag{font-size:12px;letter-spacing:2px;color:#527369}.card{background:white;border:1px solid #dce6df;border-radius:16px;padding:24px;margin-top:20px}.muted,small{color:#657770}input,button{font:inherit;border-radius:8px;padding:10px 14px;border:1px solid #c8d9cf}input[type=password]{width:min(480px,100%)}input[type=number]{width:90px}button{background:#225e49;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#f1f5f2;color:#355447}.danger{background:#fff1ed;color:#a43926;border-color:#e6c7be}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.stat{background:#f2f7f3;border-radius:10px;padding:16px}.stat b{font-size:28px;display:block}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #e6ece8;padding:12px 10px}th{font-size:12px;color:#657770}#message{min-height:24px;margin-top:14px;color:#9c3b25}#events{max-height:240px;overflow:auto;padding-left:22px}footer{margin-top:20px;color:#657770;font-size:12px}@media(max-width:600px){body{padding:20px 12px}.card{padding:18px}.stats{gap:8px}.stat{padding:10px}.stat b{font-size:24px}}
</style>
<header><div><div class="tag">VOXI CLOUD</div><h1>设备管理</h1></div><button class="secondary" id="logout" hidden>退出管理</button></header>
<section class="card" id="login"><h2>连接你的网关</h2><p class="muted">使用服务器的独立管理密钥登录。设备令牌不能用于管理。</p><form id="loginForm" class="row"><input id="secret" type="password" required autocomplete="off" placeholder="输入 ADMIN_TOKEN" aria-label="管理密钥"><button>登录</button></form></section>
<main id="dashboard" hidden>
<section class="card"><h2>连接概况</h2><div class="stats"><div class="stat">在线连接<b id="online">—</b></div><div class="stat">数量上限<b id="limitValue">—</b></div><div class="stat">可用名额<b id="available">—</b></div></div><form id="limitForm" class="row"><label for="limit">允许同时在线</label><input type="number" id="limit" min="1" max="4" required><span>台</span><button id="save">保存上限</button></form><p class="muted" id="capacity"></p><small>降低上限会保留当前连接，新连接需等到有空位。若要立即腾出名额，请先关闭不使用的设备，再断开对应连接。</small></section>
<section class="card"><div class="row"><h2>在线设备连接</h2><button class="secondary" id="refresh">刷新</button><small id="updated"></small></div><p class="muted">连接编号用于本次网关运行期间的识别。旧固件不提供唯一设备名称，可通过频道和活动情况区分。</p><div class="scroll"><table><thead><tr><th>连接</th><th>频道</th><th>状态</th><th>在线时长</th><th>音频上传</th><th>最后心跳</th><th>操作</th></tr></thead><tbody id="devices"></tbody></table></div></section>
<section class="card"><h2>近期连接事件</h2><p class="muted">包括数量限制、鉴权失败和断线原因；网关重启后清空。</p><ol id="events"></ol></section>
</main><div id="message" role="status"></div><footer>管理密钥仅保留在当前页面内存中，刷新页面后需重新登录。每 5 秒更新连接状态。</footer>
<script>
const $=id=>document.getElementById(id);let token='',polling=false;
async function api(path,body){const response=await fetch('/api/admin/'+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');return data;}
function cell(row,text){const td=document.createElement('td');td.textContent=text;row.append(td);return td;}
const labels={device_limit:'数量达到上限',unauthorized:'设备令牌被拒绝',device_opened:'设备接入',device_closed:'设备断开',limit_changed:'上限已调整',admin_disconnected:'管理员断开连接'};
async function refresh(){if(polling||!token)return;polling=true;const requestToken=token;try{const s=await api('status');if(token!==requestToken)return;$('login').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false;$('online').textContent=s.devices.length;$('limitValue').textContent=s.maxConnections;$('available').textContent=Math.max(0,s.maxConnections-s.devices.length);if(document.activeElement!==$('limit'))$('limit').value=s.maxConnections;$('limit').max=s.capacity;$('capacity').textContent=`可设置 1–${s.capacity} 台。${s.persistent?'配置已启用持久保存，重启后保留。':'当前未启用持久保存。'} 运行模式：${s.mode}`;$('devices').replaceChildren();for(const d of s.devices){const tr=document.createElement('tr');cell(tr,'#'+d.connection);cell(tr,d.channel===null?'—':d.channel+1);cell(tr,d.busy?'对话中':'已连接');cell(tr,Math.floor(d.ageMs/1000)+' 秒');cell(tr,Math.round(d.inputBytes/1024)+' KB');cell(tr,Math.floor(d.lastPongAgoMs/1000)+' 秒前');const button=document.createElement('button');button.className='danger';button.textContent='断开';button.onclick=async()=>{if(!confirm(`断开连接 #${d.connection}？设备开机时会自动尝试重连。`))return;button.disabled=true;try{await api('disconnect',{connection:d.connection});await refresh();}catch(e){$('message').textContent=e.message;}finally{button.disabled=false;}};cell(tr,'').append(button);$('devices').append(tr);}if(!s.devices.length){const tr=document.createElement('tr');const td=cell(tr,'暂无在线连接');td.colSpan=7;$('devices').append(tr);}$('events').replaceChildren();for(const e of s.events){const li=document.createElement('li');li.textContent=new Date(e.at).toLocaleTimeString()+' · '+(labels[e.reason]||labels[e.event]||e.event)+(e.connection?' · #'+e.connection:'')+(e.origin?' · '+e.origin:'')+(e.maxConnections?' · 上限 '+e.maxConnections:'');$('events').append(li);}$('updated').textContent='更新于 '+new Date().toLocaleTimeString();$('message').textContent='';}catch(e){if(token===requestToken)$('message').textContent=e.message;}finally{polling=false;}}
$('loginForm').onsubmit=async e=>{e.preventDefault();token=$('secret').value.trim();$('secret').value='';await refresh();};
$('limitForm').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api('limit',{maxConnections:Number($('limit').value)});await refresh();}catch(e){$('message').textContent=e.message;}finally{$('save').disabled=false;}};
$('refresh').onclick=refresh;$('logout').onclick=()=>{token='';$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('message').textContent='';};setInterval(refresh,5000);
</script></html>
