name: Verify Voxi
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci && npm test
        working-directory: gateway
      - run: node --test deploy/runtime-key.test.mjs
      - run: for script in deploy/*.sh .githooks/post-merge; do bash -n "$script"; done
      - run: node --test deploy/*.test.mjs
      - run: docker build -t voxi-gateway:ci .
      - run: |
          mkdir -p /tmp/tls
          printf 'DEVICE_TOKEN=ci-test\nMODE=mock\n' > /tmp/gateway.env
          docker run -d --name voxi-test --env-file /tmp/gateway.env -p 127.0.0.1:8787:8787 voxi-gateway:ci
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 1
          done
          docker logs voxi-test
          exit 1
      - name: Exercise deployment and TLS proxy
        run: |
          # Keep the unrelated 8787 listener running to reproduce the server conflict.
          sudo install -d /etc/voxi
          printf 'DEVICE_TOKEN=ci-only-token\nMODE=mock\n' | sudo tee /etc/voxi/gateway.env >/dev/null
          printf 'VOXI_HTTPS_PORT=9443\n' | sudo tee /etc/voxi/deploy.env >/dev/null
          sudo bash deploy/make-tls.sh 127.0.0.1
          bash deploy/deploy.sh --no-pull
          docker rm -f voxi-test
          sudo curl --retry 5 --retry-delay 1 --retry-all-errors --fail --cacert /etc/voxi/tls/ca.crt https://127.0.0.1:9443/healthz
          bash deploy/deploy.sh --no-pull
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: cp firmware-c6/include/config.example.h firmware-c6/include/config.h
      - run: g++ -std=c++17 tools/test_ptt_hold.cpp -o /tmp/voxi-ptt && /tmp/voxi-ptt
      - run: g++ -std=c++17 tools/test_output_gain.cpp -o /tmp/voxi-output && /tmp/voxi-output
      - run: g++ -std=c++17 tools/test_playback_gate.cpp -o /tmp/voxi-playback && /tmp/voxi-playback
      - run: g++ -std=c++17 tools/test_playback_envelope.cpp -o /tmp/voxi-envelope && /tmp/voxi-envelope
      - run: g++ -std=c++17 tools/test_radio_squelch.cpp -o /tmp/voxi-squelch && /tmp/voxi-squelch
      - run: g++ -std=c++17 tools/test_upload_recovery.cpp -o /tmp/voxi-recovery && /tmp/voxi-recovery
      - run: g++ -std=c++17 tools/test_amoled_controls.cpp -o /tmp/voxi-touch && /tmp/voxi-touch
      - run: g++ -std=c++17 tools/test_mulaw.cpp -o /tmp/voxi-mulaw && /tmp/voxi-mulaw
      - run: python tools/test_flash_layout.py
      - run: pio run --project-dir firmware-c6 -e waveshare_c6
      - run: pio run --project-dir firmware-c6 -e waveshare_s3g
      - run: pio run --project-dir firmware-c6 -e waveshare_amoled18_v2
